name: Anishka ERP - Enterprise CI Suite

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Lint, Migrate & Test Suite
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shadowsync
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest
          pip install -r requirements.txt

      - name: Code Quality & Syntax Lint (flake8)
        run: |
          # Fails if syntax errors (E9) or undefined names (F63, F7, F82) exist
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=.git,__pycache__,backup*,uploads,.pytest_cache,static*

      - name: Verify PostgreSQL Alembic Migrations
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/shadowsync"
        run: |
          alembic upgrade head

      - name: Run Test Suite (PostgreSQL)
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/shadowsync"
          ALLOW_TEST_ROLE_HEADER: "true"
          GROQ_API_KEY: ""
        run: |
          python -m pytest -v --tb=short

      - name: Run Test Suite (SQLite)
        env:
          DATABASE_URL: "sqlite:///./ci_sqlite.db"
          ALLOW_TEST_ROLE_HEADER: "true"
          GROQ_API_KEY: ""
        run: |
          python -m pytest -v --tb=short

  docker:
    name: Docker Container Build & Healthcheck
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t anishka-erp:${{ github.sha }} .

      - name: Verify Docker Container Startup & Healthcheck
        run: |
          docker run -d -p 8000:8000 \
            -e ADMIN_USERNAME=admin \
            -e ADMIN_PASSWORD=admin@2026 \
            -e ALLOW_TEST_ROLE_HEADER=true \
            anishka-erp:${{ github.sha }}
          sleep 15
          curl -f http://localhost:8000/api/health || exit 1
